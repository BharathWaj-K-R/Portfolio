name: Dynamic portfolio upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, '[dynamic-upgrade]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply interactive portfolio layer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          if 'data-dynamic-layer' in html:
              raise SystemExit('Dynamic layer already present')

          dynamic_css = r'''
            /* dynamic interaction layer */
            html{scroll-padding-top:76px;}
            body{overflow-x:hidden;}
            .scroll-progress{position:fixed;left:0;top:0;width:100%;height:3px;background:transparent;z-index:9999;pointer-events:none}
            .scroll-progress span{display:block;width:0;height:100%;background:var(--ink);transform-origin:left center}
            .cursor-orb{position:fixed;left:0;top:0;width:180px;height:180px;border:1px solid rgba(0,0,0,.12);border-radius:50%;pointer-events:none;z-index:0;opacity:0;transform:translate(-50%,-50%) scale(.7);transition:opacity .25s,transform .25s;mix-blend-mode:multiply}
            body.pointer-ready .cursor-orb{opacity:1;transform:translate(-50%,-50%) scale(1)}
            main,.opener,section,footer,nav{position:relative;z-index:1}
            .opener{min-height:calc(100vh - 58px);display:flex;align-items:center;perspective:1200px}
            .opener .wrap{width:100%}
            .opener-copy-reactive{transform:translate3d(0,0,0);transition:transform .18s ease-out}
            .opener-photo-reactive{transform:translate3d(0,0,0) rotateX(0) rotateY(0);transition:transform .18s ease-out;will-change:transform}
            .hero-live{display:inline-flex;align-items:center;gap:8px;margin:0 0 16px;padding:6px 10px;border:1px solid var(--line);font-size:10.5px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-soft)}
            .hero-live i{width:7px;height:7px;border-radius:50%;background:var(--ink);display:block;animation:pulse-dot 1.8s ease-in-out infinite}
            @keyframes pulse-dot{0%,100%{transform:scale(.8);opacity:.45}50%{transform:scale(1.15);opacity:1}}
            .hero-live-text{min-width:185px}
            .opener-photo img{transition:transform .5s cubic-bezier(.2,.7,.2,1),filter .5s ease}
            .opener-photo:hover img{transform:scale(1.025);filter:contrast(1.04)}
            .btn,.contact-links a,.proof-links a,.proj-links a,.navlinks a{transition:transform .2s ease,background .2s ease,color .2s ease,border-color .2s ease}
            .btn-magnetic,.contact-links a,.proof-links a{will-change:transform}
            .identity-grid article,.cap-item,.proof-grid div,.featured-project,.proj{transition:transform .25s ease,box-shadow .25s ease,border-color .25s ease,background .25s ease}
            .identity-grid article:hover,.cap-item:hover{transform:translateY(-5px);box-shadow:0 12px 30px rgba(0,0,0,.06);background:#fff}
            .featured-project{transform-style:preserve-3d;will-change:transform}
            .featured-project:hover{border-color:#999;box-shadow:0 18px 45px rgba(0,0,0,.08)}
            .featured-project .proj-top,.featured-project .headline,.featured-project .project-summary,.featured-project .project-proof,.featured-project .case-study,.featured-project .proj-links{transform:translateZ(14px)}
            .section-kicker{transition:letter-spacing .25s ease}
            section:hover .section-kicker{letter-spacing:.17em}
            .stat b{font-variant-numeric:tabular-nums}
            .stat.is-counting b{color:var(--ink)}
            .navlinks a.active{color:var(--ink)}
            .navlinks a.active::after{width:100%}
            .case-study summary{transition:letter-spacing .2s ease}
            .case-study summary:hover{letter-spacing:.08em}
            @media (max-width:680px){
              .cursor-orb{display:none}
              .opener{min-height:auto;padding-top:58px}
              .identity-grid article:hover,.cap-item:hover{transform:none;box-shadow:none}
            }
            @media (prefers-reduced-motion:reduce){
              .cursor-orb{display:none}
              .hero-live i{animation:none}
              .opener-copy-reactive,.opener-photo-reactive{transition:none!important}
              .featured-project,.identity-grid article,.cap-item{transition:none!important;transform:none!important}
            }
          '''

          dynamic_js = r'''
            // [dynamic-portfolio]
            const reducedMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
            const progress = document.createElement('div');
            progress.className = 'scroll-progress';
            progress.innerHTML = '<span></span>';
            document.body.prepend(progress);
            const progressBar = progress.firstElementChild;

            const orb = document.createElement('div');
            orb.className = 'cursor-orb';
            document.body.appendChild(orb);

            const heroText = document.querySelector('.opener-grid > div:first-child');
            const heroPhoto = document.querySelector('.opener-photo');
            const photoImage = heroPhoto?.querySelector('img');
            if(heroText) heroText.classList.add('opener-copy-reactive');
            if(heroPhoto) heroPhoto.classList.add('opener-photo-reactive');

            // Lightweight live status rotation: visual only, no fake claims.
            const live = document.createElement('div');
            live.className = 'hero-live';
            live.innerHTML = '<i></i><span class="hero-live-text">Currently building · AI systems</span>';
            const heroKicker = document.querySelector('.hero-kicker');
            if(heroKicker) heroKicker.insertAdjacentElement('beforebegin', live);
            const liveText = live.querySelector('.hero-live-text');
            const liveStates = ['Currently building · AI systems','Currently shipping · backend services','Currently learning · deeper systems']
            let liveIndex = 0;
            if(liveText && !reducedMotion){
              setInterval(() => {
                liveIndex = (liveIndex + 1) % liveStates.length;
                liveText.animate([{opacity:1,transform:'translateY(0)'},{opacity:0,transform:'translateY(4px)'},{opacity:1,transform:'translateY(0)'}], {duration:360,easing:'ease-out'});
                setTimeout(() => { liveText.textContent = liveStates[liveIndex]; }, 140);
              }, 2600);
            }

            const reveals = document.querySelectorAll('.reveal');
            const revealObserver = new IntersectionObserver((entries) => {
              entries.forEach(entry => {
                if(!entry.isIntersecting) return;
                entry.target.classList.add('in');
                entry.target.querySelectorAll('.stat').forEach(stat => animateStat(stat));
                revealObserver.unobserve(entry.target);
              });
            }, {threshold:.12, rootMargin:'0px 0px -8% 0px'});
            reveals.forEach(el => revealObserver.observe(el));

            function animateStat(stat){
              if(reducedMotion || stat.dataset.counted) return;
              const valueNode = stat.querySelector('b');
              if(!valueNode) return;
              const raw = valueNode.textContent.trim();
              const numeric = parseFloat(raw.replace(/[^0-9.]/g,''));
              if(!Number.isFinite(numeric)) return;
              stat.dataset.counted = '1';
              const decimals = raw.includes('.') ? (raw.split('.')[1]?.length || 0) : 0;
              const start = performance.now();
              const duration = 850;
              stat.classList.add('is-counting');
              function tick(now){
                const t = Math.min(1, (now-start)/duration);
                const eased = 1 - Math.pow(1-t, 3);
                valueNode.textContent = numeric >= 100 ? Math.round(numeric*eased).toString() : numeric.toFixed(decimals);
                if(t < 1) requestAnimationFrame(tick); else valueNode.textContent = raw;
              }
              requestAnimationFrame(tick);
            }

            function updateScroll(){
              const max = document.documentElement.scrollHeight - window.innerHeight;
              const ratio = max > 0 ? window.scrollY / max : 0;
              progressBar.style.width = `${ratio * 100}%`;
              if(reducedMotion) return;
              const y = Math.min(window.scrollY, 720);
              if(heroText) heroText.style.transform = `translate3d(0, ${y * -0.025}px, 0)`;
              if(heroPhoto) heroPhoto.style.transform = `translate3d(0, ${y * 0.018}px, 0)`;
            }
            let ticking = false;
            window.addEventListener('scroll', () => {
              if(ticking) return;
              ticking = true;
              requestAnimationFrame(() => { updateScroll(); ticking = false; });
            }, {passive:true});
            updateScroll();

            if(!reducedMotion){
              window.addEventListener('pointermove', (event) => {
                document.body.classList.add('pointer-ready');
                orb.style.left = `${event.clientX}px`;
                orb.style.top = `${event.clientY}px`;
                if(!heroPhoto || window.innerWidth <= 680) return;
                const rect = heroPhoto.getBoundingClientRect();
                if(rect.bottom < 0 || rect.top > window.innerHeight) return;
                const px = (event.clientX - rect.left) / rect.width - .5;
                const py = (event.clientY - rect.top) / rect.height - .5;
                heroPhoto.style.transform = `translate3d(${px*9}px, ${py*9}px, 0) rotateX(${py*-3}deg) rotateY(${px*4}deg)`;
              }, {passive:true});
            }

            // Magnetic CTA links.
            document.querySelectorAll('.btn,.contact-links a').forEach(el => {
              if(reducedMotion) return;
              el.classList.add('btn-magnetic');
              el.addEventListener('pointermove', event => {
                const r = el.getBoundingClientRect();
                const x = event.clientX - (r.left + r.width/2);
                const y = event.clientY - (r.top + r.height/2);
                el.style.transform = `translate(${x*.08}px, ${y*.08}px)`;
              });
              el.addEventListener('pointerleave', () => { el.style.transform = ''; });
            });

            // Subtle 3D tilt for featured project cards.
            document.querySelectorAll('.featured-project').forEach(card => {
              if(reducedMotion) return;
              card.addEventListener('pointermove', event => {
                const r = card.getBoundingClientRect();
                const px = (event.clientX-r.left)/r.width-.5;
                const py = (event.clientY-r.top)/r.height-.5;
                card.style.transform = `perspective(900px) rotateX(${py*-2.2}deg) rotateY(${px*2.8}deg) translateY(-4px)`;
              });
              card.addEventListener('pointerleave', () => { card.style.transform=''; });
            });

            // Active navigation follows the section currently in view.
            const navTargets = [...document.querySelectorAll('.navlinks a[href^="#"]')];
            const sections = navTargets.map(a => document.querySelector(a.getAttribute('href'))).filter(Boolean);
            const sectionObserver = new IntersectionObserver(entries => {
              entries.forEach(entry => {
                if(!entry.isIntersecting) return;
                navTargets.forEach(a => a.classList.toggle('active', a.getAttribute('href') === `#${entry.target.id}`));
              });
            }, {rootMargin:'-30% 0px -55% 0px', threshold:0});
            sections.forEach(section => sectionObserver.observe(section));

            // Keyboard-friendly smooth navigation for hash links.
            document.querySelectorAll('a[href^="#"]').forEach(a => a.addEventListener('click', event => {
              const target = document.querySelector(a.getAttribute('href'));
              if(!target) return;
              event.preventDefault();
              target.scrollIntoView({behavior: reducedMotion ? 'auto' : 'smooth', block:'start'});
            }));
          '''

          html = html.replace('</style>', dynamic_css + '\n</style>', 1)
          html = html.replace('<script>\n  const navtoggle', '<script>\n  ' + dynamic_js + '\n\n  const navtoggle', 1)
          html = html.replace('</html>', '<span data-dynamic-layer="1" hidden></span>\n</html>', 1)
          p.write_text(html, encoding='utf-8')
          PY

      - name: Commit upgrade
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --check
          git diff --cached --quiet && exit 0 || true
          git commit -m "feat: make portfolio dynamic and interactive [dynamic-upgrade]"
          git push

      - name: Remove helper workflow
        run: |
          git rm .github/workflows/dynamic-portfolio.yml
          git commit -m "chore: remove dynamic upgrade workflow [dynamic-cleanup]"
          git push
