services:
  - type: web
    name: bharath-portfolio
    runtime: static
    buildCommand: rm -rf dist && npm install && npm install --no-save sharp && node scripts/optimize-photo.mjs && npm run build
    staticPublishPath: dist
    headers:
      - path: /assets/*
        name: Cache-Control
        value: public,max-age=31536000,immutable
      - path: /*
        name: Cache-Control
        value: no-cache,no-store,must-revalidate
