name: Portfolio upgrade

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  upgrade:
    if: "!contains(github.event.head_commit.message, '[portfolio-upgrade]')"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Apply portfolio upgrade
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          html = p.read_text(encoding='utf-8')

          html = html.replace(
              '<title>Bharath Waj K R</title>',
              '<title>Bharath Waj K R — AI & Software Engineering</title>'
          )
          html = html.replace(
              '<meta name="description" content="Portfolio of Bharath Waj K R, B.Tech AI student and aspiring software engineer.">',
              '<meta name="description" content="Bharath Waj K R — AI and software engineering student building practical AI, backend, and full-stack systems.">' 
          )

          html = html.replace('<a href="#skills">Skills</a>', '<a href="#skills">Skills</a>')
          html = html.replace(
              '<a href="#about">About</a>\n      <a href="#skills">Skills</a>\n      <a href="#projects">Projects</a>',
              '<a href="#about">About</a>\n      <a href="#projects">Projects</a>\n      <a href="#skills">Skills</a>'
          )

          hero_old = '''<div>\n        <p class="lede">I build software the way I'd want to use it &mdash; carefully taken apart, understood, and put back together cleaner. Currently finishing a degree in Artificial Intelligence and looking for the room to do that professionally.</p>\n        <div class="name-line">\n          <span><b>Bharath Waj K R</b></span>\n          <span>B.Tech Artificial Intelligence, V.S.B. Engineering College</span>\n          <span>Dindigul, Tamil Nadu</span>\n        </div>\n        <div class="opener-cta">\n          <a class="btn btn-fill" href="#projects">See the work</a>\n          <a class="btn btn-line" href="#contact">Get in touch</a>\n        </div>\n      </div>'''

          hero_new = '''<div>\n        <div class="hero-kicker">AI · BACKEND · FULL-STACK</div>\n        <p class="lede">AI-focused software engineering student building practical AI, backend, and full-stack systems.</p>\n        <p class="hero-support">I turn ideas into deployable software, intelligent systems, and reliable backend services — with a focus on clear engineering decisions and graceful failure.</p>\n        <div class="name-line">\n          <span><b>Bharath Waj K R</b></span>\n          <span>B.Tech Artificial Intelligence, V.S.B. Engineering College</span>\n          <span>Dindigul, Tamil Nadu</span>\n        </div>\n        <div class="hero-stack">Java · Python · FastAPI · Flask · SQL · AI/ML · Docker</div>\n        <div class="opener-cta">\n          <a class="btn btn-fill" href="#projects">View projects</a>\n          <a class="btn btn-line" href="resume.pdf" target="_blank" rel="noopener">View résumé</a>\n          <a class="btn btn-line" href="https://github.com/BharathWaj-K-R" target="_blank" rel="noopener">GitHub</a>\n        </div>\n      </div>'''
          if hero_old not in html:
              raise SystemExit('Expected hero block not found')
          html = html.replace(hero_old, hero_new)

          identity = '''\n<section class="identity-section">\n  <div class="wrap reveal">\n    <div class="identity-head"><span class="idx">01 · ENGINEERING MINDSET</span><h2 class="sec-title">How I build</h2></div>\n    <div class="identity-grid">\n      <article><strong>Build systems, not demos.</strong><span>Projects should survive real inputs, failures, deployment, and change.</span></article>\n      <article><strong>Make AI behavior explicit.</strong><span>Prefer validation, fixed logic, fallbacks, and measurable targets over vague model claims.</span></article>\n      <article><strong>Keep the system explainable.</strong><span>Architecture, failure paths, and engineering trade-offs should be understandable to the next person.</span></article>\n    </div>\n  </div>\n</section>\n'''
          marker = '</header>\n\n<hr class="rule">'
          if identity.strip() not in html:
              html = html.replace(marker, '</header>\n' + identity + '\n<hr class="rule">', 1)

          html = html.replace('<div class="stat"><b>4</b><span>Shipped projects</span></div>', '<div class="stat"><b>4</b><span>Featured projects</span></div>')

          skills_section = '''<section id="skills">\n  <div class="wrap reveal">\n    <div class="section-kicker">CAPABILITY MAP</div>\n    <h2 class="sec-title">What I work with</h2>\n    <p class="sec-intro">A grouped view of the tools and domains I actually use across my projects, rather than a percentage-based skill chart.</p>\n    <div class="cap-grid">\n      <div class="cap-item"><h3>Languages</h3><p>Java · Python · JavaScript · SQL</p></div>\n      <div class="cap-item"><h3>Backend</h3><p>FastAPI · Flask · REST APIs</p></div>\n      <div class="cap-item"><h3>AI / ML</h3><p>PyTorch · transformer models · LLM API integration · computer vision</p></div>\n      <div class="cap-item"><h3>Frontend</h3><p>HTML · CSS · JavaScript</p></div>\n      <div class="cap-item"><h3>Data</h3><p>MySQL · MongoDB</p></div>\n      <div class="cap-item"><h3>Infrastructure</h3><p>Git · GitHub · Docker · Unix/Linux</p></div>\n    </div>\n  </div>\n</section>'''
          html = re.sub(r'<section id="skills">.*?</section>', skills_section, html, count=1, flags=re.S)

          proof = '''\n<hr class="rule">\n<section id="proof">\n  <div class="wrap reveal">\n    <div class="section-kicker">PROOF OF WORK</div>\n    <h2 class="sec-title">Evidence before adjectives</h2>\n    <p class="sec-intro">The point of this section is simple: show what exists, what is in progress, and where the evidence lives.</p>\n    <div class="proof-grid">\n      <div><strong>4</strong><span>featured projects</span></div>\n      <div><strong>7</strong><span>certifications</span></div>\n      <div><strong>8.41</strong><span>CGPA / 10</span></div>\n      <div><strong>2027</strong><span>expected graduation</span></div>\n    </div>\n    <div class="proof-links"><a href="https://github.com/BharathWaj-K-R" target="_blank" rel="noopener">GitHub →</a><a href="https://leetcode.com/u/Bharath_Waj_K_R/" target="_blank" rel="noopener">LeetCode →</a><a href="resume.pdf" target="_blank" rel="noopener">Résumé →</a></div>\n  </div>\n</section>\n'''
          if 'id="proof"' not in html:
              html = html.replace('</section>\n\n<hr class="rule">\n\n<section id="experience">', '</section>\n' + proof + '\n<section id="experience">', 1)

          def project_block(name, tag, headline, summary, problem, approach, result, links, featured=False):
              cls = 'proj-case featured-project' if featured else 'proj'
              details = f'''<details class="case-study"><summary>Read technical case study</summary><div class="detail-grid"><div><h4>Problem</h4><p>{problem}</p></div><div><h4>Approach</h4><p>{approach}</p></div><div><h4>Result / current state</h4><p>{result}</p></div></div></details>'''
              link_html = ' &nbsp;·&nbsp; '.join(f'<a href="{u}" target="_blank" rel="noopener">{t}</a>' for t,u in links)
              return f'''<article class="{cls}"><div class="proj-top"><h3>{name}</h3><span class="tag">{tag}</span></div><div class="headline">{headline}</div><p class="project-summary">{summary}</p><div class="project-proof"><span class="proof-label">Engineering focus</span><span>{approach}</span></div>{details}<div class="proj-links">{link_html}</div></article>'''

          projects = '''<section id="projects">\n  <div class="wrap reveal">\n    <div class="section-kicker">02 · SELECTED WORK</div>\n    <h2 class="sec-title">Projects that show how I think</h2>\n    <p class="sec-intro">The first layer is recruiter-readable. The deeper case study stays available for technical reviewers.</p>\n    <div class="projects-list">\n'''
          projects += project_block(
              'SilentBridge','Applied deep learning','Targeting signer personalization with a lightweight adapter.',
              'Real-time Indian Sign Language translation using a pose + facial-expression fusion transformer as a frozen base model, with a few-shot BridgeAdapter for signer-specific personalization.',
              "Most ISL translation models are trained on one signer's style and degrade on other signers; retraining per signer is impractical.",
              'Freeze the base transformer and learn a small adapter from about five minutes of calibration video, targeting under 2% of the base model parameters.',
              'In progress — base model + adapter architecture built; training/evaluation ongoing. Current targets: <5 min calibration, <500ms inference latency, 10–20% accuracy gain on unseen signers.',
              [('View on GitHub','https://github.com/BharathWaj-K-R/SilentBridge'),('Live demo','https://silentbridge-frontend.onrender.com')], True)
          projects += project_block(
              'ReForge','Multi-agent AI · FastAPI','AI code review with independent validation and deterministic scoring.',
              "FastAPI backend on Groq's Llama 3.3 where analysis findings are re-checked by a separate validation agent before they reach the user.",
              'Raw LLM code-review output can contain hallucinated or overstated findings.',
              'Use an analysis agent, a separate validation agent, and fixed scoring logic so the model never self-assesses its own quality score.',
              'Deployed on Render with health checks and graceful degradation from agentic analysis to an error envelope and then mock analysis when the LLM call fails.',
              [('View on GitHub','https://github.com/BharathWaj-K-R/Re_Forge'),('Live demo','https://re-forge.onrender.com/')], True)
          projects += project_block(
              'AI Interview Preparation','Full-stack · LLM','Resume-aware interview practice with an offline scoring fallback.',
              'Flask application that parses uploaded PDF/DOCX resumes, generates skills-specific questions, scores answers with an LLM, and falls back to heuristic evaluation when no key is configured.',
              'Static question banks are generic, while many LLM-backed tools fail completely when an API key is unavailable.',
              'Combine resume parsing, authentication, rate-limited LLM routes, database migrations, Docker/compose, and a heuristic fallback.',
              'Ships with auth, migrations, Docker/compose setup, and CI running the test suite on pushes.',
              [('View on GitHub','https://github.com/BharathWaj-K-R/Ai-Interview-preparation')])
          projects += project_block(
              'Stress Detection Using Handwriting','Applied ML','Offline three-class handwriting classifier with quality checks.',
              'Streamlit app using HOG features and a Random Forest classifier for Low / Medium / High stress classes on a 30-sample dataset.',
              'Explore whether handwriting carries a detectable stress signal using a non-clinical offline feature set.',
              'Extract HOG features, validate image quality, classify with Random Forest, log predictions, and support corrected-sample retraining.',
              'Educational scope only — not a diagnostic tool. The app returns class probabilities and keeps a review loop for corrected samples.',
              [('View on GitHub','https://github.com/BharathWaj-K-R/Stress-level-Detection')])
          projects += '''  </div>\n  </div>\n</section>'''
          html = re.sub(r'<section id="projects">.*?</section>', projects, html, count=1, flags=re.S)

          html = html.replace('<a href="#about">About</a>\n      <a href="#skills">Skills</a>\n      <a href="#projects">Projects</a>', '<a href="#about">About</a>\n      <a href="#projects">Projects</a>\n      <a href="#skills">Skills</a>\n      <a href="#proof">Proof</a>')

          html = html.replace('<p class="lede">Open to Software Engineer and Graduate Trainee roles &mdash; I reply quickly, and I\'d like to hear from you.</p>', '<div class="section-kicker">LET\'S TALK</div><p class="lede">Open to Software Engineer and Graduate Trainee roles.</p><p class="contact-copy">I\'m looking for a team where I can work on real software, contribute from day one, and keep getting better at the engineering underneath the product.</p>')

          css = '''\n  /* recruiter-focused portfolio layer */\n  .hero-kicker,.section-kicker{font-size:10.5px;font-weight:700;letter-spacing:.13em;color:var(--ink-soft);text-transform:uppercase;}\n  .hero-kicker{margin-bottom:14px;}\n  .hero-support{margin-top:18px;font-size:15px;color:var(--ink-soft);max-width:570px;}\n  .hero-stack{margin-top:18px;font-size:12px;font-weight:600;letter-spacing:.03em;}\n  .identity-section{padding:30px 0 56px;}\n  .identity-head{display:flex;gap:14px;align-items:baseline;margin-bottom:18px;}\n  .identity-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border-top:1px solid var(--line);border-bottom:1px solid var(--line);}\n  .identity-grid article{padding:20px;border-right:1px solid var(--line);} .identity-grid article:last-child{border-right:none;}\n  .identity-grid strong{display:block;font-family:var(--serif);font-size:17px;margin-bottom:7px;}\n  .identity-grid span{display:block;font-size:13px;color:var(--ink-soft);}\n  .cap-grid{display:grid;grid-template-columns:repeat(2,1fr);border-top:1px solid var(--line);border-left:1px solid var(--line);}\n  .cap-item{padding:20px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);} .cap-item h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px;} .cap-item p{font-size:14px;color:var(--ink-soft);}\n  .proof-grid{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);border-bottom:1px solid var(--line);} .proof-grid div{padding:20px 16px;border-right:1px solid var(--line);} .proof-grid div:last-child{border-right:none;} .proof-grid strong{display:block;font-family:var(--serif);font-size:26px;} .proof-grid span{display:block;font-size:11.5px;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;}\n  .proof-links{display:flex;gap:22px;flex-wrap:wrap;margin-top:18px;} .proof-links a{font-size:13px;font-weight:600;text-decoration:none;border-bottom:1px solid var(--ink);}\n  .projects-list{margin-top:28px;}\n  .featured-project{border:1px solid var(--line);padding:26px;margin-top:14px;} .featured-project + .featured-project{margin-top:14px;}\n  .project-summary{margin-top:10px;max-width:650px;font-size:14.5px;color:#222;}\n  .project-proof{display:grid;grid-template-columns:120px 1fr;gap:12px;margin-top:17px;padding-top:14px;border-top:1px solid var(--line-soft);font-size:13px;} .proof-label{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);}\n  .case-study{margin-top:16px;border-top:1px solid var(--line-soft);padding-top:14px;} .case-study summary{cursor:pointer;font-size:12.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;} .case-study[open] summary{margin-bottom:14px;} .detail-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;} .detail-grid h4{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft);margin-bottom:5px;} .detail-grid p{font-size:13px;color:#222;}\n  .contact-copy{font-size:15px;color:var(--ink-soft);max-width:600px;margin-top:-12px;margin-bottom:24px;}\n  .btn:focus-visible,.navlinks a:focus-visible,.proj-links a:focus-visible,.proof-links a:focus-visible,.case-study summary:focus-visible{outline:2px solid var(--ink);outline-offset:3px;}\n  @media (max-width:680px){.identity-head{flex-direction:column;gap:6px}.identity-grid{grid-template-columns:1fr}.identity-grid article{border-right:none;border-bottom:1px solid var(--line)}.identity-grid article:last-child{border-bottom:none}.cap-grid{grid-template-columns:1fr}.proof-grid{grid-template-columns:1fr 1fr}.proof-grid div:nth-child(2){border-right:none}.proof-grid div:nth-child(3),.proof-grid div:nth-child(4){border-top:1px solid var(--line)}.proof-grid div:nth-child(4){border-right:none}.detail-grid{grid-template-columns:1fr}.project-proof{grid-template-columns:1fr;gap:5px}}\n'''
          html = html.replace('</style>', css + '</style>', 1)

          p.write_text(html, encoding='utf-8')
          PY

      - name: Validate portfolio
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          html = Path('index.html').read_text(encoding='utf-8')
          assert html.count('<html') == 1 and html.count('</html>') == 1
          assert html.count('<style>') == 1 and html.count('</style>') == 1
          assert html.count('<script>') == 1 and html.count('</script>') == 1
          assert 'F4F1E9' not in html and '1C1A16' not in html and '4A473F' not in html
          assert '#FFFFFF' in html and '#000000' in html
          assert 'id="projects"' in html and 'id="skills"' in html and 'id="proof"' in html
          assert 'resume.pdf' in html
          assert 'SilentBridge' in html and 'ReForge' in html
          assert 'Target:' not in html or 'target' in html.lower()
          print('portfolio HTML validation passed')
          PY

      - name: Commit and clean up
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/portfolio-upgrade.yml
          git add index.html .github/workflows/portfolio-upgrade.yml
          git commit -m "feat: strengthen portfolio positioning and recruiter UX [portfolio-upgrade]"
          git push