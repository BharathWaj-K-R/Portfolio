name: Validate portfolio

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install dependencies
        run: npm install

      - name: Install image optimizer
        run: npm install --no-save sharp

      - name: Generate production portrait
        run: node scripts/optimize-photo.mjs

      - name: Type-check
        run: npm run check

      - name: Production build
        run: npm run build

      - name: Verify production output
        shell: bash
        run: |
          test -f dist/index.html
          test -f public/photo.webp
          if compgen -G 'dist/assets/package-lock*.json' > /dev/null; then
            echo 'Unexpected package-lock artifact found in dist/assets'
            exit 1
          fi
